name: refresh

on:
  schedule:
    # Odd minute: GitHub's scheduler runs late and DROPS on-the-hour jobs.
    - cron: "37 18 * * 1"
    - cron: "37 22 * * 1"   # same-UTC-day backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Unit tests must pass before any data is fetched
        run: python -m pytest tests/ -q --ignore=tests/test_page_smoke.py

      - name: Refresh index membership
        run: python build_universe.py

      - name: Rebuild
        run: python run_build.py

      # What the sibling sites cover, so the "Also on" row never offers a link into a
      # page that does not have the company. Consensus Drift drops about a hundred
      # names a week, so this has to be re-read, not assumed. A failed fetch falls
      # back to the committed copy in peers/ and the build carries on.
      - name: Refresh what the sibling sites cover
        run: python peers.py

      - name: Commit only if the data actually changed
        run: |
          git config user.name "shortfall-bot"
          git config user.email "noreply@github.com"
          git add docs/ universe.json peers/
          git diff --staged --quiet || git commit -m "data: weekly refresh"
          git push
